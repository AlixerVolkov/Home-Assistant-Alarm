name: Build signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Check signing secrets
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Read SIGNING_WINDOWS.md in the repository and create the four required secrets."
            exit 1
          fi

      - name: Restore release keystore
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/homepanel-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          test -s "$KEYSTORE_PATH"

      - name: Show tool versions
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Build signed release APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Prepare APK artifact
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/HomePanel-v0.4.0.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/HomePanel-v0.4.0.apk
          sha256sum dist/HomePanel-v0.4.0.apk > dist/HomePanel-v0.4.0.apk.sha256
          ls -lh dist/HomePanel-v0.4.0.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: HomePanel-v0.4.0-signed-apk
          path: |
            dist/HomePanel-v0.4.0.apk
            dist/HomePanel-v0.4.0.apk.sha256
          if-no-files-found: error
